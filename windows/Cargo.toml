[package]
name = "screenbridge"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Networking_WinSock", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_Shell"] }

[build-dependencies]
embed-resource = "3.0.12"
